<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>probe test</title>
<style>body{background:#111;color:#eee;font-family:monospace;padding:12px} pre{white-space:pre-wrap;font-size:12px}</style>
</head>
<body>
<pre id="log"></pre>
<div id="visible" style="width:320px;height:180px"></div>
<script>
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
const params = new URLSearchParams(location.search);
const vid = params.get('id') || 'RVvYQghFCXk';

function trial(name, host, vars, waitMs) {
  return new Promise((done) => {
    log('--- ' + name + ' vars=' + JSON.stringify(vars));
    let p = new YT.Player(host, {
      videoId: vid,
      playerVars: vars,
      events: {
        onReady: (e) => {
          log(name + ' ready: dur=' + e.target.getDuration() + ' st=' + e.target.getPlayerState());
          let n = 0;
          const iv = setInterval(() => {
            n++;
            let d = {}, dur = 0, st = '';
            try { d = e.target.getVideoData() || {}; dur = e.target.getDuration(); st = e.target.getPlayerState(); } catch (err) {}
            log(name + ' t' + n + ' st=' + st + ' dur=' + dur + ' isLive=' + d.isLive + ' playable=' + d.isPlayable + ' err=' + d.errorCode);
            if (n >= 6) { clearInterval(iv); try { e.target.destroy(); } catch (x) {} done(); }
          }, waitMs);
        },
        onError: (e) => { log(name + ' ERROR ' + e.data); done(); },
        onStateChange: (e) => log(name + ' state ' + e.data)
      }
    });
  });
}

window.onYouTubeIframeAPIReady = async () => {
  log('api ready');
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-10000px;top:0;width:320px;height:180px;opacity:0;pointer-events:none';
  document.body.appendChild(host);
  await trial('offscreen-default', host, { autoplay: 1, mute: 1, playsinline: 1, rel: 0 }, 700);
  await trial('offscreen-controls0', document.body.appendChild(document.createElement('div')), { autoplay: 1, mute: 1, controls: 0, playsinline: 1, rel: 0, origin: location.origin }, 700);
  await trial('visible-default', document.getElementById('visible'), { autoplay: 1, mute: 1, playsinline: 1, rel: 0 }, 700);
  log('done');
};
const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
</script>
</body></html>
