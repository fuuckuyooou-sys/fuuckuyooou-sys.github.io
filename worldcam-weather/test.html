<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>embed test</title>
<style>body{background:#111;color:#eee;font-family:monospace;padding:16px} #p{width:480px;height:270px;background:#000} pre{white-space:pre-wrap}</style>
</head>
<body>
<p>YouTube embed 동작 확인용 페이지 (임시)</p>
<div id="p"></div>
<pre id="log"></pre>
<script>
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
const params = new URLSearchParams(location.search);
const ids = (params.get('ids') || '5B4LmH4JbnY').split(',');
let idx = 0;
function next() {
  if (idx >= ids.length) return;
  const id = ids[idx];
  const holder = document.createElement('div');
  holder.style.cssText = 'width:480px;height:270px';
  document.getElementById('p').innerHTML = '';
  document.getElementById('p').appendChild(holder);
  log('--- ' + id);
  const p = new YT.Player(holder, {
    videoId: id,
    playerVars: { autoplay: 1, mute: 1, playsinline: 1, origin: location.origin },
    events: {
      onReady: (e) => {
        log('ready; duration=' + e.target.getDuration() + ' state=' + e.target.getPlayerState());
        setTimeout(() => {
          let d = 0; try { d = e.target.getDuration(); } catch (err) {}
          log('after 1.5s duration=' + d + ' state=' + e.target.getPlayerState() + ' data=' + JSON.stringify(e.target.getVideoData()));
          idx++; next();
        }, 1500);
      },
      onError: (e) => { log('ERROR code=' + e.data); idx++; setTimeout(next, 300); },
      onStateChange: (e) => { log('state ' + e.data); }
    }
  });
  window.__p = p;
}
function boot() { log('YT ready'); next(); }
const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
window.onYouTubeIframeAPIReady = boot;
window.addEventListener('error', (e) => log('JS ERROR: ' + e.message));
</script>
</body></html>
